# Release: on every push to main, decide whether the commit history
# warrants a version bump (Conventional Commits), and if so:
#
#   1. Update Cargo.toml + Cargo.lock + installer/arcthumb.iss
#   2. Build the release DLL and arcthumb-config.exe
#   3. Compile the Inno Setup installer
#   4. Commit the version bump and create a `vX.Y.Z` tag
#   5. Publish a GitHub Release with ArcThumb-Setup.exe attached
#   6. (separate job) Submit a manifest PR to microsoft/winget-pkgs
#
# Everything happens in one workflow run, so there is no need for a
# Personal Access Token to chain workflows. The default GITHUB_TOKEN
# (with the repo's "Read and write" workflow permissions) is enough.
#
# Conventional Commits mapping:
#   feat!:        / BREAKING CHANGE: in body  -> major bump
#   feat:                                     -> minor bump
#   fix: / chore: / docs: / refactor: / etc.  -> patch bump
#   anything without a recognised prefix      -> no bump (workflow exits)
#
# The build step runs BEFORE the commit/tag push, so if the build
# fails the repository is left untouched — no half-released versions.
#
# Re-running is safe. The `release` job checks what already exists for
# the computed version before doing anything:
#   - tag exists      -> the bump commit + tag push is skipped
#   - release exists  -> the build and the release upload are skipped,
#                        so a re-run never replaces a published installer
#                        (the winget manifest pins its SHA256)
# The winget submission lives in its own job, so "Re-run failed jobs"
# after a winget hiccup retries only the submission, not the build.
# The submission itself is skipped if a PR for that version is already
# open or merged in microsoft/winget-pkgs.

name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Bump, build, and publish
    runs-on: windows-latest
    # Don't loop on our own bump commits.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        uses: paulhatch/semantic-version@v6.0.4
        with:
          tag_prefix: "v"
          # Conventional Commits — `feat!:` or `feat(scope)!:` etc.
          major_pattern: "/^[a-z]+(\\([^)]+\\))?!:/"
          major_regexp_flags: "m"
          minor_pattern: "/^feat(\\([^)]+\\))?:/"
          minor_regexp_flags: "m"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false
          # Pick up "BREAKING CHANGE:" footers in commit bodies.
          search_commit_body: true

      - name: Show computed version
        shell: bash
        run: |
          echo "version       = ${{ steps.version.outputs.version }}"
          echo "version_type  = ${{ steps.version.outputs.version_type }}"
          echo "increment     = ${{ steps.version.outputs.increment }}"

      # Outputs:
      #   skip        no bumpable commits since the last tag; nothing to do
      #   tag_exists  vX.Y.Z is already on origin (a previous attempt pushed it)
      #   publish     build + release are needed (skip == false and no
      #               release for vX.Y.Z exists yet)
      - name: Skip if no version change or already released
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if [ "${{ steps.version.outputs.version_type }}" = "none" ]; then
            echo "No bumpable commits since the last tag — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists on origin; the bump commit will not be pushed again."
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping build and upload."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.gate.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: steps.gate.outputs.publish == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Update Cargo.toml version
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.version.outputs.version }}"/' Cargo.toml

      - name: Update Cargo.lock
        if: steps.gate.outputs.publish == 'true'
        run: cargo update -p arcthumb

      - name: Update installer version
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          sed -i 's/#define MyAppVersion    ".*"/#define MyAppVersion    "${{ steps.version.outputs.version }}"/' installer/arcthumb.iss

      - name: Build release binaries
        if: steps.gate.outputs.publish == 'true'
        run: cargo build --release

      - name: Build Inno Setup installer
        if: steps.gate.outputs.publish == 'true'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: installer/arcthumb.iss
          options: /O+

      - name: Verify installer exists
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        run: |
          if (-Not (Test-Path "target/installer/ArcThumb-Setup.exe")) {
            Write-Error "Installer not found at target/installer/ArcThumb-Setup.exe"
            exit 1
          }
          Get-Item "target/installer/ArcThumb-Setup.exe" | Format-List Name, Length

      # Skipped when the tag already exists: a re-run checks out the
      # original commit, so pushing another bump commit on top of the one
      # a previous attempt already pushed would be rejected as
      # non-fast-forward.
      - name: Commit version bump and tag
        if: steps.gate.outputs.publish == 'true' && steps.gate.outputs.tag_exists == 'false'
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock installer/arcthumb.iss
          # If sed didn't change anything (e.g. Cargo.toml was already at the
          # target version, common on the very first release), there is
          # nothing to commit — but we still want to tag the current HEAD
          # so the release/asset upload steps can run.
          if git diff --cached --quiet; then
            echo "No file changes to commit; tagging current HEAD as v${{ steps.version.outputs.version }}."
          else
            git commit -m "chore: bump version to v${{ steps.version.outputs.version }} [skip ci]"
            git push origin main
          fi
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.gate.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          files: target/installer/ArcThumb-Setup.exe
          generate_release_notes: true
          draft: false
          prerelease: false

  # Submit a manifest update PR to microsoft/winget-pkgs so the new
  # version is reachable via `winget install CitrusSoda.ArcThumb`.
  # Requires repo secret WINGET_TOKEN (a Classic PAT with `public_repo`
  # scope). If the secret is missing, the job warns and skips without
  # failing the release.
  #
  # Separate job on purpose: wingetcreate talks to GitHub's fork-sync
  # API, which fails now and then. When it does, "Re-run failed jobs"
  # retries only this job against the already-published installer.
  winget:
    name: Submit to winget-pkgs
    needs: release
    if: needs.release.outputs.skip == 'false'
    runs-on: windows-latest
    steps:
      - name: Submit manifest PR
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Warning "WINGET_TOKEN secret not set; skipping winget submission."
            exit 0
          }

          # wingetcreate names its PRs "New version: <Id> version <Ver>".
          # If one already exists (a previous attempt got through, or the
          # PR was submitted by hand), don't open a duplicate.
          # (No quotes inside the arguments: PowerShell mangles embedded
          # double quotes when calling native executables, so the exact
          # title match is done here rather than in jq.)
          $title = "New version: CitrusSoda.ArcThumb version $env:VERSION"
          $env:GH_TOKEN = $env:WINGET_TOKEN
          $existing = gh pr list --repo microsoft/winget-pkgs --state all `
            --search "$title in:title" --json number,title,state |
            ConvertFrom-Json | Where-Object { $_.title -eq $title }
          if ($existing) {
            $list = ($existing | ForEach-Object { "#$($_.number) ($($_.state))" }) -join ", "
            Write-Host "winget-pkgs already has a PR for ${env:VERSION}: $list - skipping."
            exit 0
          }

          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          # Give GitHub Releases CDN a moment to propagate the new asset URL
          # before wingetcreate tries to download it to compute SHA256.
          Start-Sleep -Seconds 15
          # The base manifest has two installer entries (Scope: user with
          # /CURRENTUSER, Scope: machine with /ALLUSERS) that point at the
          # same exe. Both match on architecture + installer type, so we
          # have to disambiguate them with the wingetcreate URL override
          # syntax `<url>|<architecture>|<scope>`. Without the scope
          # override wingetcreate fails with "Multiple matches found".
          # Adding a third installer entry later means adding a third
          # --urls argument with its own scope override.
          $url = "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION/ArcThumb-Setup.exe"
          .\wingetcreate.exe update CitrusSoda.ArcThumb `
            --version $env:VERSION `
            --display-version $env:VERSION `
            --urls "$url|x64|user" "$url|x64|machine" `
            --token $env:WINGET_TOKEN `
            --submit
